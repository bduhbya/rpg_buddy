name: Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-validation:
    name: Windows validation
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install declared npm version
        run: npm install --global "$((Get-Content package.json -Raw | ConvertFrom-Json).packageManager)"
      - name: Install locked Node dependencies
        run: npm ci
      - name: Install Python verification tools
        run: python -m pip install -r data_contracts/verification-requirements.txt -r data_contracts/verification-typecheck-requirements.txt
      - name: Check formatting
        run: npm run format:check
      - name: Check TypeScript
        run: npm run typecheck
      - name: Run unit tests
        run: npm run test:unit
      - name: Verify data contracts and fixtures
        run: python data_contracts/verify_contracts.py
      - name: Check Python types
        run: python -m mypy --strict --no-namespace-packages data_contracts/verification data_contracts/verify_contracts.py
      - name: Package desktop application
        run: npm run package
      - name: Run development and packaged Electron tests
        run: npm run test:smoke
      - name: Retain failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-test-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
